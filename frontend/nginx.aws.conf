# AWS/ECS production config - static Angular SPA only.
#
# Unlike nginx.conf.template (local Docker Compose), this config proxies
# nothing: on AWS the Application Load Balancer routes the API paths
# (/investigations, /events, /health, /ready, /webhooks/github) straight
# to the backend ECS service, so requests for them never reach this
# container. There is deliberately no proxy_pass, upstream, resolver or
# backend address here - the frontend container needs no knowledge of
# where the backend runs.
#
# Copied verbatim to /etc/nginx/conf.d/default.conf (no envsubst
# templating), so it is used exactly as written.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular single-page app - any route that isn't a real file falls
    # back to index.html so client-side routing works on deep links and
    # page refreshes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
