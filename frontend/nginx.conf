server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API routes to the backend service by its Docker Compose
    # service name - never hardcode localhost here.
    location /investigations {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /events {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://backend:8000;
    }

    location /ready {
        proxy_pass http://backend:8000;
    }

    # Angular single-page app - any other route falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
